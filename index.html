<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast History View App</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        /* Item History Styling */
        .history-list {
            max-width: 500px;
            margin: 0 auto;
        }
        .history-card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: background 0.2s;
        }
        .history-card:hover {
            background: #eef2f5;
        }
        .item-title {
            font-weight: bold;
            font-size: 16px;
            color: #0275d8;
        }
        .item-subtext {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        /* Modal (Popup) Styling */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0;
            top: 0;
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.6); 
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            max-width: 450px;
            width: 100%;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .close-btn {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
        }
        .close-btn:hover {
            color: #000;
        }
        .modal-img-container {
            width: 100%;
            height: 250px;
            background-color: #eee;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            overflow: hidden;
        }
        .modal-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h2>History List</h2>
    
    <!-- History Cards Display Area -->
    <div class="history-list" id="historyContainer"></div>

    <!-- Details and Image Modal (Popup) -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle">--</h3>
            <p id="modalDate" style="color: #888; font-size: 12px;"></p>
            <p id="modalDescription">--</p>
            
            <div class="modal-img-container">
                <img id="modalImage" src="" alt="Loading Image...">
            </div>
        </div>
    </div>

    <script>
        // Sample Firebase / Database History Data
        const historyData = [
            {
                id: "1",
                title: "Item 01 Details",
                date: "2026-09-02 10:00 AM",
                description: "මෙතන පළමු Item එකේ විස්තර සටහන් වේ.",
                imageUrl: "https://via.placeholder.com/400x300?text=Item+1+Image"
            },
            {
                id: "2",
                title: "Item 02 Details",
                date: "2026-09-02 11:30 AM",
                description: "මෙතන දෙවන Item එකේ විස්තර සටහන් වේ.",
                imageUrl: "https://via.placeholder.com/400x300?text=Item+2+Image"
            }
        ];

        // Load History Items without Loading Images initially
        function loadHistory() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = "";

            historyData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'history-card';
                // Image එක Load කරන්නේ නැත. Details පමණක් පෙන්වයි
                card.innerHTML = `
                    <div class="item-title">${item.title}</div>
                    <div class="item-subtext">Date: ${item.date}</div>
                `;
                
                // Touch/Click කළ විට Modal එක Open වීම
                card.onclick = () => openModal(index);
                container.appendChild(card);
            });
        }

        // Open Modal and Load Image on Demand
        function openModal(index) {
            const item = historyData[index];
            
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalDate').innerText = item.date;
            document.getElementById('modalDescription').innerText = item.description;
            
            // Touch කළ පසු පමණක් Image URL එක Assign වේ
            document.getElementById('modalImage').src = item.imageUrl;

            document.getElementById('detailModal').style.display = 'flex';
        }

        // Close Modal
        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
            // Modal එක Close කළ පසු Image එක Clear කරයි
            document.getElementById('modalImage').src = "";
        }

        // Initialize History on Load
        loadHistory();
    </script>
</body>
</html>
